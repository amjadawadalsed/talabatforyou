<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>جارٍ التحويل…</title>
<style>body{font-family:system-ui,Tahoma,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#eef5f1;color:#10231b;text-align:center}@media(prefers-color-scheme:dark){body{background:#0c1713;color:#e8f3ed}}</style></head>
<body><p id="m">جارٍ فتح واتساب…</p>
<script src="config.js"></script>
<script>
var c=(location.search.match(/[?&]c=([a-z0-9-]{3,30})/i)||[])[1],C=window.WLQ_CONFIG||{},m=document.getElementById("m");
if(!c||!C.SUPABASE_URL){m.textContent="رابط غير صالح."}else{
fetch(C.SUPABASE_URL+"/rest/v1/rpc/resolve_link",{method:"POST",headers:{"Content-Type":"application/json",apikey:C.ANON_KEY,Authorization:"Bearer "+C.ANON_KEY},body:JSON.stringify({p_code:c})})
.then(function(r){return r.json()})
.then(function(u){if(typeof u==="string"&&u.indexOf("https://wa.me/")===0){location.replace(u)}else{m.textContent="هذا الرابط غير موجود."}})
.catch(function(){m.textContent="تعذّر الاتصال، حاول لاحقاً."})}
</script></body></html>
