<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>إحصائيات الرابط</title>
<style>
:root{--bg:#eef5f1;--card:#fff;--ink:#10231b;--muted:#56695f;--line:#d4e2da;--brand:#0f8a5a;--bi:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c1713;--card:#14241d;--ink:#e8f3ed;--muted:#9db3a8;--line:#25382f;--brand:#2ec58a;--bi:#05261a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,sans-serif;line-height:1.7}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;margin:6px 0;min-height:46px;direction:ltr;text-align:left}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:var(--bi);min-height:46px;cursor:pointer;width:100%}
.n{font-size:48px;font-weight:800;color:var(--brand);line-height:1.1}.m{color:var(--muted);font-size:14px}.i{display:block;width:100%;text-align:start;background:none;color:var(--ink);border:1px solid var(--line);margin-top:8px;direction:ltr}
a{color:var(--brand)}
</style></head><body><div class="w">
<h1>إحصائيات رابطك القصير</h1>
<div class="c"><input id="c" placeholder="الكود مثل abc123"><input id="t" placeholder="مفتاح التتبع"><button id="go" type="button">عرض النقرات</button><p id="e" class="m" role="alert"></p></div>
<div class="c" id="r" style="display:none"><div class="n" id="n"></div><div>عدد النقرات</div><p class="m" id="d"></p></div>
<div class="c" id="l" style="display:none"><b>روابطك المحفوظة على هذا الجهاز</b><div id="ls"></div></div>
</div>
<script src="config.js"></script>
<script>
var C=window.WLQ_CONFIG||{},$=function(i){return document.getElementById(i)};
function show(c,t){$("e").textContent="";$("r").style.display="none";
 if(!C.SUPABASE_URL){$("e").textContent="عدّل ملف config.js أولاً.";return}
 fetch(C.SUPABASE_URL+"/rest/v1/rpc/link_stats",{method:"POST",headers:{"Content-Type":"application/json",apikey:C.ANON_KEY,Authorization:"Bearer "+C.ANON_KEY},body:JSON.stringify({p_code:c,p_token:t})})
 .then(function(r){return r.json()}).then(function(j){
  if(!j||j.clicks===undefined){$("e").textContent="الكود أو المفتاح غير صحيح.";return}
  $("n").textContent=j.clicks;
  var f=function(x){return x?new Date(x).toLocaleString("ar"):"لا يوجد"};
  $("d").textContent="أُنشئ: "+f(j.created_at)+" — آخر نقرة: "+f(j.last_click);$("r").style.display="block"})
 .catch(function(){$("e").textContent="تعذّر الاتصال، حاول لاحقاً."})}
$("go").onclick=function(){show($("c").value.trim(),$("t").value.trim())};
var h=location.hash.slice(1),p=new URLSearchParams(h);
if(p.get("c")){$("c").value=p.get("c");$("t").value=p.get("t")||"";show($("c").value,$("t").value)}
try{var a=JSON.parse(localStorage.getItem("wlq_links")||"[]");if(a.length){$("l").style.display="block";a.slice().reverse().forEach(function(o){var b=document.createElement("button");b.className="i";b.type="button";b.textContent=o.c;b.onclick=function(){$("c").value=o.c;$("t").value=o.t;show(o.c,o.t)};$("ls").appendChild(b)})}}catch(e){}
</script></body></html>
